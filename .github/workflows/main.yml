name: Build REDA MUSIC APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  UV_PYTHON: "3.12"
  PYTHONUTF8: "1"
  FLET_CLI_NO_RICH_OUTPUT: "1"

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Generate Android project
        shell: bash
        run: |
          uv run flet build apk --yes --verbose

      - name: Add audio file support to Android
        shell: bash
        run: |
          MANIFEST="build/flutter/android/app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "AndroidManifest.xml not found!"
            exit 1
          fi

          python - <<'PY'
          from pathlib import Path

          manifest = Path("build/flutter/android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text(encoding="utf-8")

          intent_filter = """
              <intent-filter>
                  <action android:name="android.intent.action.VIEW" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <data android:mimeType="audio/*" />
              </intent-filter>
          """

          marker = """
              <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
              </intent-filter>
          """

          if "android:mimeType=\"audio/*\"" in text:
              print("Audio intent-filter already exists.")
          elif marker in text:
              text = text.replace(
                  marker,
                  marker + intent_filter,
                  1
              )
              manifest.write_text(text, encoding="utf-8")
              print("Audio intent-filter added successfully.")
          else:
              raise SystemExit(
                  "Could not find the launcher intent-filter."
              )
          PY

          echo "----- AndroidManifest.xml -----"
          grep -A8 -B3 'audio/\*' "$MANIFEST" || true

      - name: Rebuild APK with audio support
        shell: bash
        run: |
          uv run flet build apk --yes --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: REDA-MUSIC-APK
          path: build/apk/*.apk
          if-no-files-found: error
          retention-days: 30
