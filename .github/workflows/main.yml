name: Build REDA MUSIC APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  UV_PYTHON: "3.12"
  PYTHONUTF8: "1"
  FLET_CLI_NO_RICH_OUTPUT: "1"

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Generate Flet Android project
        shell: bash
        run: |
          uv run flet build apk --yes --verbose --arch arm64-v8a

      - name: Configure Android to receive audio files
        shell: bash
        run: |
          MANIFEST="build/flutter/android/app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "ERROR: AndroidManifest.xml not found"
            exit 1
          fi

          python - <<'PY'
          from pathlib import Path
          import re

          manifest = Path(
              "build/flutter/android/app/src/main/AndroidManifest.xml"
          )

          text = manifest.read_text(encoding="utf-8")

          audio_filter = """
              <intent-filter>
                  <action android:name="android.intent.action.VIEW" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <category android:name="android.intent.category.BROWSABLE" />
                  <data android:mimeType="audio/*" />
              </intent-filter>
          """

          # Don't add it twice
          if 'android:mimeType="audio/*"' in text:
              print("Audio intent-filter already exists.")
              raise SystemExit(0)

          # Find the Flutter MainActivity.
          activity_pattern = re.compile(
              r'(<activity\b[^>]*android:name="[^"]*MainActivity"[^>]*>)',
              re.MULTILINE
          )

          match = activity_pattern.search(text)

          if not match:
              print("ERROR: MainActivity was not found.")
              print("Activities found:")

              for m in re.finditer(
                  r'<activity\b[^>]*android:name="([^"]+)"',
                  text
              ):
                  print(" -", m.group(1))

              raise SystemExit(1)

          activity_start = match.end()

          # Find the closing tag belonging to this activity.
          depth = 1
          pos = activity_start

          tag_pattern = re.compile(r'<(/?)activity\b[^>]*>', re.MULTILINE)

          closing_position = None

          for tag in tag_pattern.finditer(text, activity_start):
              full_tag = tag.group(0)

              if full_tag.startswith("</"):
                  depth -= 1

                  if depth == 0:
                      closing_position = tag.start()
                      break

              elif not full_tag.rstrip().endswith("/>"):
                  depth += 1

          if closing_position is None:
              print("ERROR: Could not locate MainActivity closing tag.")
              raise SystemExit(1)

          text = (
              text[:closing_position]
              + audio_filter
              + text[closing_position:]
          )

          manifest.write_text(text, encoding="utf-8")

          print("Audio intent-filter added successfully.")
          PY

          echo "Checking AndroidManifest..."
          grep -n -A8 -B3 'audio/\*' "$MANIFEST"

      - name: Build final APK
        shell: bash
        run: |
          uv run flet build apk \
            --yes \
            --verbose \
            --arch arm64-v8a \
            --cleanup-app

      - name: Show APK size
        shell: bash
        run: |
          ls -lh build/apk/*.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: REDA-MUSIC-ARM64
          path: build/apk/*.apk
          if-no-files-found: error
          retention-days: 30
