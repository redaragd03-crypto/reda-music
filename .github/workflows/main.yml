name: Build REDA MUSIC APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  UV_PYTHON: "3.12"
  PYTHONUTF8: "1"
  FLET_CLI_NO_RICH_OUTPUT: "1"

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Accept Android licenses
        shell: bash
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          elif [ -n "$ANDROID_SDK_ROOT" ] && [ -f "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          else
            SDKMANAGER=$(find "$ANDROID_HOME" "$ANDROID_SDK_ROOT" \
              -type f -name sdkmanager 2>/dev/null | head -n 1)

            if [ -n "$SDKMANAGER" ]; then
              yes | "$SDKMANAGER" --licenses || true
            else
              echo "sdkmanager not found"
              exit 1
            fi
          fi

      - name: Clean previous Flet build
        shell: bash
        run: |
          uv run flet clean

      - name: Build REDA MUSIC ARM64 APK
        shell: bash
        run: |
          uv run flet build apk \
            --yes \
            --verbose \
            --arch arm64-v8a \
            --cleanup-app \
            --cleanup-packages \
            --android-legacy-packaging

      - name: Show APK size
        shell: bash
        run: |
          echo "======================================"
          echo "        REDA MUSIC APK SIZE"
          echo "======================================"
          ls -lh build/apk/*.apk
          du -h build/apk/*.apk
          echo "======================================"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: REDA-MUSIC-ARM64
          path: build/apk/*.apk
          if-no-files-found: error
          retention-days: 30
